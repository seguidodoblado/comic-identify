[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-identify"
version = "0.20.4"
description = "Identificación de cómics a partir de su portada"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26"]
[project.optional-dependencies]
gui = ["PyGObject>=3.42"]
dev = ["pytest>=7", "ruff>=0.6"]
[project.scripts]
comic-identify = "comic_identify.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
