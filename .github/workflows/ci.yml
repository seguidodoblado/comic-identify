name: CI

# Se ejecuta en cada push a main, en cada pull request, a mano y, como workflow reutilizable,
# desde cd.yml: así el CD solo despliega si este mismo CI pasa sobre el commit etiquetado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests y ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Herramientas de sistema que usan los tests
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zbar-tools gettext

      # unrar y rar viven en multiverse: si no están, los tests que las necesitan se saltan
      - name: Herramientas RAR (opcionales)
        continue-on-error: true
        run: sudo apt-get install -y unrar rar

      - name: Instalar el proyecto
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      # Las pruebas de traducción necesitan los .mo compilados
      - name: Compilar las traducciones
        run: sh i18n-compile.sh

      - name: pytest
        run: pytest -q -rs

  deb:
    name: Paquete .deb y lintian
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian gettext

      # build-deb.sh deja el .deb en el directorio padre; se copia a dist/ para subirlo
      - name: Construir el .deb
        run: |
          ./build-deb.sh
          mkdir dist
          cp ../comic-identify_*.deb dist/

      # Falla ante errores de lintian; los avisos (W) e informativos (I) solo se muestran.
      # El informe va al resumen del job aunque falle.
      - name: lintian
        run: |
          set +e
          lintian --info --display-info --fail-on error dist/*.deb | tee lintian.txt
          status=${PIPESTATUS[0]}
          {
            echo "### lintian"
            echo
            if [ -s lintian.txt ]; then
              echo '```'
              cat lintian.txt
              echo '```'
            elif [ "$status" -eq 0 ]; then
              echo "✅ Sin etiquetas: \`$(basename dist/*.deb)\` pasa lintian limpio."
            else
              echo "❌ lintian terminó con código $status sin generar informe."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # El CD (cd.yml) descarga este artefacto por su nombre para publicarlo: si se cambia, cambiarlo allí también
      - uses: actions/upload-artifact@v7
        with:
          name: comic-identify-deb
          path: dist/*.deb
          if-no-files-found: error
