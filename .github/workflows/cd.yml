name: CD

# Al subir una etiqueta vX.Y.Z (solo la versión upstream, sin la revisión Debian):
# construye el .deb, le pasa lintian y deja una release en BORRADOR con el .deb,
# las notas de debian/changelog, las notas autogeneradas de GitHub y el SHA-256.
# La revisas en GitHub y pulsas «Publish release».
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Construir y crear la release en borrador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian gettext

      # La etiqueta lleva solo la parte upstream: tiene que coincidir con debian/changelog
      - name: Comprobar que la etiqueta coincide con debian/changelog
        run: |
          version=$(dpkg-parsechangelog -S Version)
          if [ "v${version%-*}" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con debian/changelog ($version)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # build-deb.sh deja el .deb en el directorio padre; se copia a dist/
      - name: Construir el .deb
        run: |
          ./build-deb.sh
          mkdir dist
          cp ../comic-identify_*.deb dist/

      # Falla ante errores de lintian; los avisos (W) e informativos (I) solo se muestran.
      - name: lintian
        run: |
          set +e
          lintian --info --display-info --fail-on error dist/*.deb | tee lintian.txt
          status=${PIPESTATUS[0]}
          {
            echo "### lintian"
            echo
            if [ -s lintian.txt ]; then
              echo '```'
              cat lintian.txt
              echo '```'
            elif [ "$status" -eq 0 ]; then
              echo "✅ Sin etiquetas: \`$(basename dist/*.deb)\` pasa lintian limpio."
            else
              echo "❌ lintian terminó con código $status sin generar informe."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Notas: la entrada de esta versión de debian/changelog (la primera) + SHA-256.
      # Las notas autogeneradas de GitHub las añade --generate-notes al crear la release.
      - name: Preparar las notas
        run: |
          deb=$(ls dist/*.deb)
          awk '
            NR == 1 { next }
            /^ -- / { exit }
            { sub(/^  /, ""); sub(/^\* /, "- "); print }
          ' debian/changelog > notes.md
          {
            echo
            echo "**SHA-256 del .deb:** \`$(sha256sum "$deb" | cut -d' ' -f1)\`"
          } >> notes.md
          cat notes.md

      - name: Crear la release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(ls dist/*.deb)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Reintento de un workflow que falló a medias: solo se vuelve a subir el .deb
            gh release upload "$GITHUB_REF_NAME" "$deb" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$deb" \
              --draft \
              --verify-tag \
              --title "comic-identify ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --generate-notes
          fi
